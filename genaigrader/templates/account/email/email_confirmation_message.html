<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        .email-body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9fafb;
            color: #111827;
            padding: 40px 20px;
            text-align: center;
        }
        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: left;
        }
        .email-header {
            font-size: 24px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 20px;
            text-align: center;
        }
        .email-content {
            font-size: 16px;
            line-height: 1.6;
            color: #4b5563;
            margin-bottom: 30px;
        }
        .button-container {
            text-align: center;
            margin: 30px 0;
        }
        .cta-button {
            display: inline-block;
            background-color: #3b82f6;
            color: #ffffff;
            padding: 14px 28px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
        }
        .email-footer {
            font-size: 14px;
            color: #9ca3af;
            text-align: center;
            margin-top: 30px;
            border-top: 1px solid #e5e7eb;
            padding-top: 20px;
        }
    </style>
</head>
<body class="email-body">
    <div class="email-container">
        <div class="email-header">
            Confirm your account
        </div>
        <div class="email-content">
            <p>Hello {{ user_display }},</p>
            <p>Please confirm your email address to complete your registration at GenAI Grader.</p>

            <div class="button-container">
                <a href="{{ activate_url }}" class="cta-button">Confirm Account</a>
            </div>

            <p>If you did not request this, you can safely ignore this email.</p>
        </div>
        <div class="email-footer">
            <p>Best regards,<br>The GenAI Grader Team</p>
        </div>
    </div>
</body>
</html>
